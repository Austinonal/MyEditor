<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoCut home</title><link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--c-bg);color:var(--c-text);font:var(--fw-body) var(--fs-body)/var(--lh-body) var(--font-sans)}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.page{max-width:1100px;margin:0 auto;padding:0 var(--l-screen-gutter) 96px}
.top{height:var(--l-header);display:flex;align-items:center;gap:8px}
.top b{flex:1;font-size:var(--fs-title)}
.ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:none;border:0;color:var(--c-text)}
h1{font-size:var(--fs-headline);line-height:var(--lh-headline);margin:16px 0 4px}
.sub{color:var(--c-text-muted);margin:0 0 16px}
h2{font-size:var(--fs-label);color:var(--c-text-muted);margin:24px 0 8px;font-weight:600}
.tools{display:grid;gap:12px;grid-template-columns:1fr}
.tool{display:flex;gap:16px;align-items:center;text-align:left;width:100%;min-height:88px;padding:16px;border-radius:var(--r-lg);background:var(--c-surface-raised);border:1px solid var(--c-border);color:var(--c-text);font:inherit;cursor:pointer;transition:background var(--m-fast) var(--m-ease),transform var(--m-fast) var(--m-ease)}
.tool:hover{background:var(--c-surface-high)}.tool:active{transform:scale(.98)}
.tool:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
.tool .ic{width:56px;height:56px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--c-accent-soft);color:var(--c-accent);flex:none}
.tool .ic svg{width:28px;height:28px}
.tool b{display:block;font-size:var(--fs-body);font-weight:600}
.tool span.d{color:var(--c-text-muted);font-size:var(--fs-label);line-height:20px;display:block}
.tool.main{background:linear-gradient(160deg,var(--c-accent-soft),var(--c-surface-raised));border-color:var(--c-accent)}
.tool.main .ic{background:var(--c-accent);color:var(--c-on-accent)}
.tool.soon{background:var(--c-surface);border-style:dashed;color:var(--c-text-muted)}
.tool.soon .ic{background:var(--c-surface-high);color:var(--c-text-muted)}
.tool.soon b{color:var(--c-text)}
.badge{margin-left:auto;flex:none;font-size:var(--fs-caption);font-weight:600;padding:4px 10px;border-radius:999px;background:var(--c-surface-high);color:var(--c-text)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:0;font:inherit;font-weight:600;font-size:var(--fs-label);background:var(--c-surface-high);color:var(--c-text);cursor:pointer}
.chip[aria-pressed=true]{background:var(--c-accent-soft);color:var(--c-accent);outline:1px solid var(--c-accent)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);margin-top:12px}
.proj{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);overflow:hidden}
.th{aspect-ratio:9/12;background:linear-gradient(135deg,#25375a,#14161a);position:relative}
.th.t{aspect-ratio:16/9;background:linear-gradient(135deg,#5a3a25,#14161a)}
.proj .m{padding:8px 12px;font-weight:600;font-size:var(--fs-label)}.proj small{display:block;color:var(--c-text-muted);font-weight:400;font-size:var(--fs-caption)}
.kind{position:absolute;left:8px;top:8px;display:inline-flex;gap:4px;align-items:center;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.6);font-size:var(--fs-caption);font-weight:600}
.kind svg{width:14px;height:14px}
.nav{position:fixed;left:0;right:0;bottom:0;height:var(--l-toolbar);display:flex;background:var(--c-surface);border-top:1px solid var(--c-border);padding-bottom:env(safe-area-inset-bottom)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:var(--fs-caption);color:var(--c-text-muted);font-weight:600;min-height:48px}
.nav a.on{color:var(--c-accent)}
@media(min-width:768px){.tools{grid-template-columns:repeat(3,1fr)}.tool{flex-direction:column;align-items:flex-start;min-height:168px}.badge{margin:0}.grid{grid-template-columns:repeat(4,1fr)}.nav{display:none}.page{padding-bottom:48px}}
@media(prefers-reduced-motion:reduce){.tool{transition:none}}
</style></head><body><div class="page">
<div class="top"><b>AutoCut</b><button class="ib" aria-label="ตั้งค่า"><svg><use href="#gear"/></svg></button></div>
<h1>วันนี้อยากสร้างอะไร</h1><p class="sub">เลือกเครื่องมือ แล้วเริ่มจากต้นแบบหรือเริ่มเอง</p>
<section aria-label="เครื่องมือ"><div class="tools" id="tools"></div></section>
<h2>ล่าสุด</h2>
<div class="chips" role="group" aria-label="กรองประเภท"><button class="chip" aria-pressed="true">ทั้งหมด</button><button class="chip" aria-pressed="false">วิดีโอ</button><button class="chip" aria-pressed="false">ปกคลิป</button></div>
<div class="grid">
 <div class="proj"><div class="th"><span class="kind"><svg><use href="#film"/></svg>วิดีโอ</span></div><div class="m">คลิปเที่ยวทะเล<small>6 สล็อต · เหลือ 2 ช่องว่าง</small></div></div>
 <div class="proj"><div class="th" style="background:linear-gradient(135deg,#3a2a5c,#14161a)"><span class="kind"><svg><use href="#film"/></svg>วิดีโอ</span></div><div class="m">รีวิวสินค้า<small>7 สล็อต · พร้อมส่งออก</small></div></div>
 <div class="proj"><div class="th t"><span class="kind"><svg><use href="#image"/></svg>ปกคลิป</span></div><div class="m">ปกคลิปทะเล<small>16:9 · แบบร่าง</small></div></div>
</div></div>
<nav class="nav"><a class="on"><svg><use href="#home"/></svg>หน้าแรก</a><a><svg><use href="#film"/></svg>โปรเจกต์</a><a><svg><use href="#gear"/></svg>ตั้งค่า</a></nav>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="film" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M17 8h4M3 16h4M17 16h4"/></symbol>
<symbol id="wand" viewBox="0 0 24 24"><path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8L19 13M17.8 6.2L19 5M3 21l9-9M12.2 6.2L11 5"/></symbol>
<symbol id="scissors" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/></symbol>
<symbol id="image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></symbol>
</defs></svg>
<script>
// Tool registry: adding a future tool = one new entry, no layout change.
// shortcut: static list, move to the shared project.kind model when the thumbnail tool ships.
const TOOLS=[
 {id:"autocut",icon:"wand",title:"Auto Cut",desc:"โยนคลิปต้นแบบ ได้โครงร่างพร้อมบล็อกว่าง",main:true},
 {id:"edit",icon:"scissors",title:"ตัดต่อปกติ",desc:"เริ่มจากรูปหรือคลิปของคุณเอง"},
 {id:"thumb",icon:"image",title:"ปกคลิปอัตโนมัติ",desc:"โยนปกต้นแบบ ได้เลย์เอาต์พร้อมช่องใส่รูป",soon:true}];
document.getElementById("tools").innerHTML=TOOLS.map(t=>`<button class="tool ${t.main?"main":""} ${t.soon?"soon":""}" data-tool="${t.id}"${t.soon?' aria-describedby="soon"':""}><span class="ic"><svg><use href="#${t.icon}"/></svg></span><span><b>${t.title}</b><span class="d">${t.desc}</span></span>${t.soon?'<span class="badge">เร็วๆ นี้</span>':""}</button>`).join("")+'<span id="soon" hidden>ฟีเจอร์นี้ยังไม่เปิดใช้งาน</span>';
</script></body></html>
